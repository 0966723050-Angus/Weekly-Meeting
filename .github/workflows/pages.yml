# 部署到 GitHub Pages(只發布網站需要的檔案)。
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - name: Stamp version
        # 以 commit 代碼作為版本號:App 比對 version.json 發現新版就強制重新載入;
        # 同時更新靜態檔的 ?v= 與 Service Worker 快取名稱,避免讀到舊檔
        run: |
          V="${GITHUB_SHA::8}"
          echo "{\"version\":\"$V\"}" > _site/version.json
          sed -i "s/__BUILD_VERSION__/$V/" _site/js/config.js
          sed -i -E "s/\?v=[0-9a-z]+/?v=$V/g" _site/index.html
          sed -i -E "s/atk-weekly-[0-9a-z]+/atk-weekly-$V/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
